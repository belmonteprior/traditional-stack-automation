services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - 9090:9090
    depends_on:
      - backend

  backend:
    build:
      context: backend
      target: builder
